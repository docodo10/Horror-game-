# Builds the Windows version of the Godot game (pc/) and, when asked, publishes it
# as a GitHub Release so it can be downloaded from the repository's "Releases" page.
# Run it from the Actions tab ("Build PC (Windows)" → "Run workflow").
name: Build PC (Windows)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the .zip"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-pc
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows-templates

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/.godot-bin && cd ~/.godot-bin
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          # Keep only what a Windows export needs (the full archive is ~1 GB).
          unzip -q -j templates.tpz templates/version.txt 'templates/windows_*_x86_64*.exe' -d "$dest"
          rm templates.tpz
          ls -la "$dest"

      - name: Import assets
        run: ~/.godot-bin/godot --headless --path pc --import 2>&1 | grep -vE "^\s*$" | tail -40

      - name: Export Windows build
        run: |
          set -euo pipefail
          mkdir -p pc/build/windows
          ~/.godot-bin/godot --headless --path pc --export-release "Windows Desktop" build/windows/LaGardienne.exe 2>&1 \
            | grep -vE "savepack|Storing File|^\s*$" | tail -40
          test -s pc/build/windows/LaGardienne.exe
          ls -la pc/build/windows

      - name: Smoke test (Linux build of the same project, headless)
        run: |
          set -euo pipefail
          out=$(timeout 300 ~/.godot-bin/godot --headless --path pc --quit-after 600 -- --autostart 2>&1 || true)
          echo "$out" | tail -40
          if echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Failed to load script"; then
            echo "::error::Script errors during the smoke test"; exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          out=LaGardienne-Windows
          mkdir -p "$out"
          cp pc/build/windows/LaGardienne.exe "$out/"
          cp pc/release/* "$out/"
          zip -9 -r "$out.zip" "$out"
          ls -la "$out.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: LaGardienne-Windows
          path: LaGardienne-Windows.zip
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "La Gardienne — PC Windows (build ${{ github.run_number }})"
          body_path: .github/release-notes-pc.md
          files: LaGardienne-Windows.zip
          make_latest: true
